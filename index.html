<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:#0b0a14;color:#fff;font-family:'Press Start 2P','Noto Sans TC',monospace;overflow:hidden;height:100vh}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;width:640px;height:360px;overflow:hidden;image-rendering:pixelated;background:linear-gradient(#ecd0a8 0 240px,#8a5a34 240px 246px,#b4713f 246px)}
.btn{font:10px 'Press Start 2P',monospace;background:#ffe066;color:#222;border:3px solid #222;box-shadow:3px 3px #000;padding:8px 12px;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px #000}
.box{background:#1b1433;border:4px solid #fff;box-shadow:6px 6px #000;padding:16px;width:520px;max-width:92vw}
#boot{position:fixed;inset:0;z-index:50;background:#05050f;display:flex;align-items:center;justify-content:center;text-align:center}
#boot.gone{display:none}#boot p,#boot pre,#boot h2{margin:12px 0;font-size:11px;line-height:1.8;text-align:left}
#boot h2{color:#7dff9b;text-align:center}#boot h1{font-size:14px}
#ver{position:fixed;right:8px;bottom:6px;font-size:8px;color:#666;z-index:99}
#pw{text-align:center}#pw p{text-align:center!important}#pwMsg{color:#ff6b6b;min-height:16px}
#pw input,.codein{font:20px 'Press Start 2P',monospace;width:170px;text-align:center;letter-spacing:6px;background:#000;color:#7dff9b;border:3px solid #fff;padding:8px;margin:6px 8px 6px 0}
.codein{display:block;margin:14px auto 0}
.bad{animation:bad .4s steps(4)}@keyframes bad{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.obj{position:absolute;cursor:pointer;transition:transform .3s,filter .3s}
.obj:hover{outline:3px dashed #ffe066;outline-offset:3px;filter:brightness(1.2)}
.locked{filter:grayscale(.6) brightness(.85)}
#diary::after,#frame::after,.bright .obj::after{content:'✦';position:absolute;top:-10px;right:-6px;color:#ffe066;font-size:12px;opacity:0;animation:sp 5s infinite steps(5)}
#frame::after{animation-delay:2s}.bright .obj::after{animation-duration:2s}
@keyframes sp{0%,80%{opacity:0}85%,95%{opacity:1}}
#window{left:260px;top:30px;width:120px;height:100px;border:6px solid #8b5a3c;overflow:hidden;background:#6fb7e9}
.sky{position:absolute;inset:0;background:linear-gradient(#7cc4f0,#d8f0ff);animation:sky 6s infinite steps(6)}
@keyframes sky{50%{filter:brightness(1.12)}}
.cur{position:absolute;top:0;width:52%;height:100%;background:repeating-linear-gradient(90deg,#b5485c 0 6px,#963a4c 6px 12px);transition:transform 3s ease-in-out;animation:sway 4s infinite steps(4)}
#curL{left:0}#curR{right:0}@keyframes sway{50%{top:2px}}
.open #curL{transform:translateX(-88%)}.open #curR{transform:translateX(88%)}
#beam{position:absolute;left:250px;top:130px;width:140px;height:230px;background:linear-gradient(rgba(255,240,150,.4),transparent);clip-path:polygon(0 0,100% 0,135% 100%,-35% 100%);opacity:0;transition:opacity 3s;pointer-events:none}
.open #beam{opacity:1}
#dark{position:absolute;inset:0;background:rgba(5,5,25,.88);pointer-events:none;transition:opacity 3s;z-index:9}
.open #dark{opacity:0}.dim #dark{opacity:.65}
#clock{left:420px;top:28px;width:58px;height:58px;background:#fff;border:4px solid #4a2b16;border-radius:50%}
#clock i{position:absolute;left:calc(50% - 1px);bottom:50%;background:#000;transform-origin:bottom}
#clock #hh{height:14px;width:4px;left:calc(50% - 2px)}#clock #mm{height:21px;width:2px}
#clock #ss{height:22px;background:#d22;width:1px}
#frame{left:150px;top:44px;width:64px;height:80px;background:#fff;border:6px solid #6b3f22;padding:4px}
#frame b{display:block;height:100%;background:linear-gradient(#9cd,#7b9)}
#wardrobe{left:14px;top:96px;width:100px;height:170px;background:#2a1a10;border:5px solid #4a2b16;overflow:hidden}
#shirt{position:absolute;left:30px;top:18px;width:40px;height:60px;background:#111;border-top:8px solid #333}
#wardrobe u{position:absolute;top:0;width:50%;height:100%;background:#9b633a;text-decoration:none;transition:transform 1.8s ease-in-out;border:3px solid #6e4424}
.dl{left:0;transform-origin:left}.dr{right:0;transform-origin:right}
#wardrobe.open .dl,#wardrobe.open .dr{transform:scaleX(.12)}
#bed{left:130px;top:196px;width:180px;height:96px;background:#e9dcc4;border:5px solid #5a3a22}
.pillow{position:absolute;left:8px;top:8px;width:44px;height:26px;background:#fff;border:3px solid #ccd}
#blanket{position:absolute;left:58px;right:0;top:0;bottom:0;transition:transform 1s;background:radial-gradient(#fff 3px,transparent 4px) 0 0/18px 18px,#6aa5d6}
#bed.lift #blanket{transform:translateY(-8px)}
#rug{left:210px;top:300px;width:240px;height:48px;background:repeating-linear-gradient(90deg,#c05a5a 0 12px,#e8a0a0 12px 24px);border:4px solid #8a3a3a}
#desk{position:absolute;left:440px;top:180px;width:170px;height:62px;background:#8b5a3c;border-top:12px solid #b87a4b}
#drawer{left:452px;top:204px;width:146px;height:30px;background:#6b4229;border:3px solid #3d2516}
#drawer.open{transform:translateY(12px)}
#diary{left:470px;top:158px;width:42px;height:22px;background:#fff;border:3px solid #bbb;border-left:8px solid #999}
#diary.lockd::before{content:'🔒';position:absolute;left:10px;top:-3px;font-size:14px}
#speaker{left:560px;top:138px;width:44px;height:42px;background:#333;border:3px solid #111}
.led{position:absolute;right:4px;top:4px;width:8px;height:8px;background:#a22;animation:blink 2s infinite steps(2)}
#speaker.on .led{background:#3f6;animation-duration:.6s}@keyframes blink{50%{opacity:.3}}
#plush{left:420px;top:268px;width:34px;height:30px;background:#a0703c;border:3px solid #6b4520;animation:bob 3s infinite steps(3)}
#plush::before{content:'';position:absolute;left:6px;top:8px;width:4px;height:4px;background:#000;box-shadow:12px 0 #000}
.ear{position:absolute;top:-10px;left:0;width:10px;height:12px;background:#7a4f28;animation:ear 5s infinite steps(2)}.ear.r{left:auto;right:0}
@keyframes bob{50%{margin-top:-2px}}@keyframes ear{0%,90%{height:12px}95%{height:8px}}
#plush.shake{animation:shake .6s steps(6)}@keyframes shake{25%{margin-left:-4px}75%{margin-left:4px}}
#cake{z-index:5;left:330px;top:262px;width:56px;height:40px;background:#f7c5d5;border:4px solid #c2587a;animation:bob 2s infinite steps(2)}
.cn{position:absolute;top:-18px;width:4px;height:14px;background:#fff}.cn:nth-child(1){left:10px}.cn:nth-child(2){left:22px}.cn:nth-child(3){left:34px}
.cn b{position:absolute;top:-8px;left:-2px;width:8px;height:8px;background:#ffb300;animation:blink .4s infinite steps(2)}
#cake.out .cn b{display:none}
#openBtn{position:absolute;left:260px;top:140px;z-index:10;animation:blink 1.2s infinite steps(2)}
#hud{position:fixed;inset:6px 6px auto 6px;display:none;justify-content:space-between;align-items:flex-start;gap:6px;z-index:20;font-size:8px;line-height:1.7;pointer-events:none}
.play #hud{display:flex}#hud div{background:#000c;border:3px solid #fff;padding:6px;white-space:pre}#hud .btn{pointer-events:auto;padding:4px 8px}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#000d;border:3px solid #fff;padding:8px 12px;font:12px 'Noto Sans TC';z-index:30;display:none}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1b1433;border:4px solid #ffe066;padding:10px 14px;font:11px 'Press Start 2P','Noto Sans TC';z-index:70;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center;max-width:90vw;line-height:1.7;white-space:pre-line}
#toast.show{opacity:1}
#dlg{position:fixed;inset:0;background:#0008;z-index:60;display:flex;align-items:center;justify-content:center}
#dt{font-size:12px;color:#ffe066;margin-bottom:12px;line-height:1.6}
#db{font:15px/1.9 'Noto Sans TC',sans-serif;white-space:pre-wrap;max-height:60vh;overflow:auto}
#db.flip{animation:flip .5s steps(5)}@keyframes flip{from{opacity:0;transform:translateX(12px)}}
#dbtn{margin-top:14px;display:flex;gap:10px;justify-content:flex-end}
.photo{width:100%;max-height:45vh;object-fit:contain;animation:fade 3s;margin-bottom:8px;display:block}@keyframes fade{from{opacity:0}}
.ph{border:3px dashed #888;padding:30px;text-align:center;font-size:11px;margin-bottom:8px}
</style></head>
<body data-state="identity-check">
<section id="boot"><div class="box">
<h1>SYSTEM CHECK</h1><p>身分確認中，檢測</p>
<p id="bar">[░░░░░░░░░░] 0%</p><pre id="log"></pre>
<h2 id="ok" hidden>PLAYER VERIFIED.<br>WELCOME.</h2>
<div id="pw" hidden><p>ENTER PASSCODE</p>
<input id="pwIn" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="----">
<button id="pwBtn" class="btn">▶ OK</button><p id="pwMsg"></p></div>
</div></section>
<div id="ver">v5</div>

<div id="hud"><div id="quest"></div><div id="mem"></div><button id="restart" class="btn">↻</button></div>

<div id="wrap"><div id="stage">
<div id="window" class="obj" data-id="window"><div class="sky"></div><div id="curL" class="cur"></div><div id="curR" class="cur"></div></div>
<div id="beam"></div>
<div id="clock" class="obj" data-id="clock"><i id="hh"></i><i id="mm"></i><i id="ss"></i></div>
<div id="frame" class="obj" data-id="frame"><b></b></div>
<div id="wardrobe" class="obj" data-id="wardrobe"><span id="shirt"></span><u class="dl"></u><u class="dr"></u></div>
<div id="rug" class="obj" data-id="rug"></div>
<div id="bed" class="obj" data-id="bed"><span class="pillow"></span><span id="blanket"></span></div>
<div id="desk"></div>
<div id="drawer" class="obj" data-id="drawer"></div>
<div id="diary" class="obj lockd" data-id="diary"></div>
<div id="speaker" class="obj" data-id="speaker"><i class="led"></i></div>
<div id="plush" class="obj" data-id="plush"><i class="ear"></i><i class="ear r"></i></div>
<div id="cake" class="obj" data-id="cake" hidden><i class="cn"><b></b></i><i class="cn"><b></b></i><i class="cn"><b></b></i></div>
<div id="dark"></div>
<button id="openBtn" class="btn" hidden>[CLICK TO OPEN]</button>
</div></div>

<div id="hint"></div><div id="toast"></div>
<div id="dlg" hidden><div class="box"><h2 id="dt"></h2><div id="db"></div><div id="dbtn"></div></div></div>

<script>
'use strict';
/* ===== 在這裡改文字、照片、音樂、密碼 ===== */
const CFG={
bgm:'slo-mo.mp3',
music:'i-love-you-3000.mp3',
photo:'photo.jpg',
pass:'0530',
diaryCode:'1005',
bedNote:'毯子底下有一張小紙條：\n\n「時鐘停住的那一刻，\n就是日記本的密碼。」',
diary:['今天是個特別的日子。\n這本日記，是為你準備的第一個秘密。','翻到這一頁的你，\n一定發現這個房間有點不一樣了。','繼續探索吧，\n每一件物品都藏著一段回憶。'],
frame:'這張照片……是那天最自然的笑容。（請換成你們的回憶）',
shirt:'那件黑色襯衫，還留著那天的味道。（請換成相關回憶）',
drawer:'抽屜裡有一張小紙條：「謝謝你一直都在。」',
plush:'你找到我了！我是守護這個房間的小狗。',
speaker:'I Love You 3000',
final:'親愛的 ○○：\n\n生日快樂！\n這一路上的每一個回憶，都是因為有你才特別。\n願新的一歲，溫暖、可愛、一切順心。\n\n— 署名'};
/* ======================================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const S={state:'identity-check',got:{},open:false,playing:false,mode:'bgm',diaryOK:false,done:false,after:null};
const A={bgm:null,love:null};
const IDS=['diary','frame','shirt','drawer','plush','speaker'];
const cnt=()=>IDS.filter(i=>S.got[i]).length;
const setState=s=>{S.state=s;document.body.dataset.state=s};
const txt=t=>{const d=document.createElement('div');d.textContent=t;return d};
function toast(t){const e=$('#toast');e.textContent=t;e.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2400)}

function mk(src,loop){try{const a=new Audio(src);a.loop=loop;a.preload='auto';return a}catch(e){return null}}
function playA(a){try{const r=a&&a.play();r&&r.catch&&r.catch(()=>{})}catch(e){}}
function startBgm(){if(S.mode!=='bgm')return;if(!A.bgm)A.bgm=mk(CFG.bgm,true);if(A.bgm&&A.bgm.paused)playA(A.bgm)}
document.addEventListener('pointerdown',startBgm);

function dlg(title,node,btns){$('#dt').textContent=title;const b=$('#db');b.className='';void b.offsetWidth;b.className='flip';b.innerHTML='';b.append(node);
const bt=$('#dbtn');bt.innerHTML='';(btns||[{t:'CLOSE',f:closeDlg}]).forEach(x=>{const k=document.createElement('button');k.className='btn';k.textContent=x.t;k.onclick=x.f;bt.append(k)});$('#dlg').hidden=false}
function closeDlg(){$('#dlg').hidden=true;const a=S.after;S.after=null;a&&a()}
function hud(){$('#mem').textContent='MEMORIES\n'+IDS.map(i=>S.got[i]?'▣':'□').join(' ');
const q=[['Explore the room',S.open],['Find the diary',S.got.diary],['Find the photo',S.got.frame],['Find the black shirt',S.got.shirt],['Discover all memories',cnt()===6]];
$('#quest').textContent='QUEST'+(cnt()===6?' COMPLETE':'')+'\n'+q.map(a=>(a[1]?'▣ ':'□ ')+a[0]).join('\n')}
const chk=()=>{if(cnt()===6&&!S.done){S.done=true;complete()}};
const memDone=()=>{S.after=chk};
function found(id,st){if(S.got[id])return;S.got[id]=1;hud();toast('NEW MEMORY FOUND!');if(st)setState(st)}

const LOCK={frame:['diary','先打開日記本吧。'],wardrobe:['frame','也許照片裡有線索……'],drawer:['shirt','抽屜鎖著，衣櫃裡也許有線索。'],plush:['drawer','抽屜裡好像有提示。'],speaker:[null,'再多找幾個回憶，音響才會有反應。']};
const locked=id=>{const l=LOCK[id];return l?(id==='speaker'?cnt()<4:!S.got[l[0]]):false};

function diaryLock(){const w=document.createElement('div');w.append(txt('日記本上了鎖。\n請輸入 4 位數密碼。'));
 const i=document.createElement('input');i.className='codein';i.maxLength=4;i.inputMode='numeric';i.placeholder='----';w.append(i);
 const go=()=>{if(i.value.trim()===CFG.diaryCode){S.diaryOK=true;$('#diary').classList.remove('lockd');toast('UNLOCKED!');H.diary()}else{toast('密碼錯誤');i.value=''}};
 i.onkeydown=e=>{if(e.key==='Enter')go()};
 dlg('LOCKED DIARY',w,[{t:'UNLOCK',f:go},{t:'CLOSE',f:closeDlg}]);setTimeout(()=>i.focus(),60)}

const H={
window(){toast('窗外的天氣，很適合過生日。')},
diary(){if(!S.diaryOK)return diaryLock();
 found('diary','diary-found');let p=0;const n=CFG.diary.length;
 const show=()=>dlg(`DIARY ${p+1}/${n}`,txt(CFG.diary[p]),[...(p?[{t:'◀ PREV',f:()=>{p--;show()}}]:[]),p<n-1?{t:'NEXT ▶',f:()=>{p++;show()}}:{t:'CLOSE',f:closeDlg}]);
 memDone();show()},
frame(){found('frame','photo-found');const w=document.createElement('div');const im=new Image();im.className='photo';
 im.onerror=()=>{const p=document.createElement('div');p.className='ph';p.textContent='[ PHOTO PLACEHOLDER ]\n請放入 photo.jpg';im.replaceWith(p)};
 im.src=CFG.photo;w.append(im,txt(CFG.frame));dlg('MEMORY: PHOTO',w);memDone()},
wardrobe(){$('#wardrobe').classList.add('open');found('shirt','shirt-found');memDone();
 setTimeout(()=>dlg('NEW ITEM FOUND: Black Shirt',txt(CFG.shirt)),1600)},
drawer(){$('#drawer').classList.add('open');found('drawer');memDone();
 setTimeout(()=>dlg('DRAWER',txt(CFG.drawer)),1000)},
plush(){const p=$('#plush');p.classList.add('shake');setTimeout(()=>p.classList.remove('shake'),650);found('plush');memDone();
 setTimeout(()=>dlg('你找到我了！',txt(CFG.plush)),500)},
speaker(){const s=$('#speaker');
 try{if(!A.love)A.love=mk(CFG.music,true);
  if(S.mode==='bgm'){S.mode='love';if(A.bgm){A.bgm.pause();A.bgm.currentTime=0}}
  if(S.playing){A.love&&A.love.pause();S.playing=false;s.classList.remove('on');toast('MUSIC OFF')}
  else{playA(A.love);S.playing=true;s.classList.add('on');toast('NOW PLAYING\n'+CFG.speaker)}}
 catch(e){toast('NOW PLAYING\n'+CFG.speaker)}
 if(!S.got.speaker){found('speaker');setTimeout(chk,1400)}},
bed(){const b=$('#bed');b.classList.add('lift');setTimeout(()=>b.classList.remove('lift'),1000);
 setTimeout(()=>dlg('NOTE',txt(CFG.bedNote)),600)},
rug(){toast('嗯？好像沒有什麼……')},
clock(){toast('時鐘停在 10:05')},
cake(){const c=$('#cake');if(c.classList.contains('out'))return finalCard();
 c.classList.add('out');$('#stage').classList.add('dim');setState('final');toast('HAPPY BIRTHDAY');setTimeout(finalCard,1800)}};
function finalCard(){const w=document.createElement('div');w.append(txt('QUEST COMPLETE\nYou found every birthday memory.\n\n'),txt(CFG.final));
 dlg('HAPPY BIRTHDAY!',w,[{t:'↻ RESTART',f:()=>location.reload()},{t:'CLOSE',f:closeDlg}])}
function complete(){setState('memories-complete');
 dlg('ALL MEMORIES FOUND.',txt('QUEST COMPLETE.'),[{t:'▶ CONTINUE',f:()=>{closeDlg();$('#stage').classList.add('bright');$('#cake').hidden=false;toast('點擊蛋糕，吹熄蠟燭吧');if(!S.playing)H.speaker()}}])}

function openCurtain(){if(S.open)return;S.open=true;$('#stage').classList.add('open');$('#openBtn').hidden=true;document.body.classList.add('play');
 setState('room');hud();setTimeout(()=>toast('QUEST STARTED\nFind all the birthday memories.'),1800)}
function toCurtain(){if(S.state!=='password'&&S.state!=='identity-check')return;$('#boot').classList.add('gone');setState('curtain');$('#openBtn').hidden=false}

function checkPw(){const v=$('#pwIn').value.trim();
 if(v===CFG.pass){startBgm();toCurtain()}
 else{$('#pwMsg').textContent='ACCESS DENIED';const b=$('#boot .box');b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');$('#pwIn').value=''}}
function showPw(){if(S.state!=='identity-check')return;setState('password');$('#pw').hidden=false;try{$('#pwIn').focus()}catch(e){}}
$('#pwBtn').onclick=checkPw;$('#pwIn').onkeydown=e=>{if(e.key==='Enter')checkPw()};

$('#stage').addEventListener('click',e=>{const o=e.target.closest('.obj');if(!o)return;const id=o.dataset.id;
 try{if(S.state==='curtain'||S.state==='identity-check'||S.state==='password'){if(id==='window'&&S.state==='curtain')openCurtain();return}
  if(!$('#dlg').hidden||S.state==='final'&&id!=='cake')return;
  if(locked(id)){toast(LOCK[id][1]);return}
  H[id]&&H[id]()}catch(err){console.error(err);toast('…')}});
$('#openBtn').onclick=openCurtain;$('#restart').onclick=()=>location.reload();
const HINT={diary:'▶ 日記本上了鎖……',frame:'▶ 這張照片……',wardrobe:'▶ 裡面好像藏著什麼。',drawer:'▶ 抽屜……',plush:'▶ 咦，它在動？',speaker:'▶ 播放音樂',window:'▶ [OPEN] 拉開窗簾',cake:'▶ 吹熄蠟燭',clock:'▶ 看看時間',bed:'▶ 毯子底下好像有東西'};
$$('.obj').forEach(o=>o.dataset.hint=HINT[o.dataset.id]||'▶ 查看');
$('#stage').addEventListener('mouseover',e=>{const o=e.target.closest('.obj'),h=$('#hint');if(o){h.textContent=o.dataset.hint;h.style.display='block';o.classList.toggle('locked',S.open&&locked(o.dataset.id))}else h.style.display='none'});
$('#stage').addEventListener('mouseleave',()=>$('#hint').style.display='none');

function fit(){$('#stage').style.transform=`scale(${Math.min(innerWidth/640,innerHeight/360)})`}
function tick(){const d=new Date();$('#ss').style.transform=`rotate(${d.getSeconds()*6}deg)`;$('#mm').style.transform='rotate(30deg)';$('#hh').style.transform='rotate(302.5deg)'}
function boot(){let p=0;const L={30:'> Detecting player...',60:'> Loading room...',90:'> Preparing birthday quest...'};
 const t=setInterval(()=>{p+=2;const n=Math.floor(p/10);$('#bar').textContent=`[${'█'.repeat(n)}${'░'.repeat(10-n)}] ${p}%`;
  if(L[p])$('#log').textContent+=L[p]+'\n';
  if(p>=100){clearInterval(t);$('#ok').hidden=false;setTimeout(showPw,1200)}},70)}
try{fit();addEventListener('resize',fit);tick();setInterval(tick,1000);hud()}catch(e){console.error(e)}
try{boot()}catch(e){console.error(e);showPw()}
setTimeout(showPw,9000);
</script></body></html>
