<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body data-state="identity-check">
<section id="boot"><div class="box">
<h1>SYSTEM CHECK</h1><p>身分確認中，檢測</p>
<p id="bar">[░░░░░░░░░░] 0%</p><pre id="log"></pre>
<h2 id="ok" hidden>PLAYER VERIFIED.<br>WELCOME.</h2>
<div id="pw" hidden><p>ENTER PASSCODE</p>
<input id="pwIn" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="----">
<button id="pwBtn" class="btn">▶ OK</button><p id="pwMsg"></p></div>
</div></section>

<div id="hud"><div id="quest"></div><div id="mem"></div><button id="restart" class="btn">↻</button></div>

<div id="wrap"><div id="stage">
<div id="window" class="obj" data-id="window"><div class="sky"></div><div id="curL" class="cur"></div><div id="curR" class="cur"></div></div>
<div id="beam"></div>
<div id="clock" class="obj" data-id="clock"><i id="hh"></i><i id="mm"></i><i id="ss"></i></div>
<div id="frame" class="obj" data-id="frame"><b></b></div>
<div id="wardrobe" class="obj" data-id="wardrobe"><span id="shirt"></span><u class="dl"></u><u class="dr"></u></div>
<div id="rug" class="obj" data-id="rug"></div>
<div id="bed" class="obj" data-id="bed"><span class="pillow"></span><span id="blanket"></span></div>
<div id="desk"></div>
<div id="drawer" class="obj" data-id="drawer"></div>
<div id="diary" class="obj lockd" data-id="diary"></div>
<div id="speaker" class="obj" data-id="speaker"><i class="led"></i></div>
<div id="plush" class="obj" data-id="plush"><i class="ear"></i><i class="ear r"></i></div>
<div id="cake" class="obj" data-id="cake" hidden><i class="cn"><b></b></i><i class="cn"><b></b></i><i class="cn"><b></b></i></div>
<div id="dark"></div>
<button id="openBtn" class="btn" hidden>[CLICK TO OPEN]</button>
</div></div>

<div id="hint"></div><div id="toast"></div>
<div id="dlg" hidden><div class="box"><h2 id="dt"></h2><div id="db"></div><div id="dbtn"></div></div></div>
<script src="script.js"></script></body></html>
